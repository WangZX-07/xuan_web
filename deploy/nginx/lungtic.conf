limit_req_zone $binary_remote_addr zone=respulse_lungtic_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=respulse_lungtic_console:10m rate=5r/s;

upstream respulse_lungtic_control {
    server 127.0.0.1:9100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name respulse.top www.respulse.top console.respulse.top;
    access_log /var/log/nginx/respulse-lungtic-http.access.log;
    error_log /var/log/nginx/respulse-lungtic-http.error.log;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.respulse.top;
    ssl_certificate /etc/letsencrypt/live/respulse.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/respulse.top/privkey.pem;
    return 301 https://respulse.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name respulse.top;
    ssl_certificate /etc/letsencrypt/live/respulse.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/respulse.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/respulse-lungtic-public.access.log;
    error_log /var/log/nginx/respulse-lungtic-public.error.log;
    root /opt/lungtic/current/public-web;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /api/public/ {
        limit_req zone=respulse_lungtic_public burst=40 nodelay;
        proxy_pass http://respulse_lungtic_control;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_protected/releases/ {
        internal;
        alias /srv/lungtic-data/releases/;
        sendfile on;
        aio threads;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
    }
    location /_protected/assets/ {
        internal;
        alias /srv/lungtic-data/assets/;
        sendfile on;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.respulse.top;
    ssl_certificate /etc/letsencrypt/live/console.respulse.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.respulse.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/respulse-lungtic-console.access.log;
    error_log /var/log/nginx/respulse-lungtic-console.error.log;
    client_max_body_size 10m;
    root /opt/lungtic/current/admin-web;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
    location ~ ^/(api/admin|auth)/ {
        limit_req zone=respulse_lungtic_console burst=20 nodelay;
        proxy_pass http://respulse_lungtic_control;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/public/assets/ {
        proxy_pass http://respulse_lungtic_control;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_protected/assets/ {
        internal;
        alias /srv/lungtic-data/assets/;
        sendfile on;
    }
    location / { try_files $uri $uri/ /index.html; }
}
