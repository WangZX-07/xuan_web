server {
    listen 80;
    listen [::]:80;
    server_name respulse.top www.respulse.top console.respulse.top;

    access_log /var/log/nginx/respulse-lungtic-bootstrap.access.log;
    error_log /var/log/nginx/respulse-lungtic-bootstrap.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
