name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: lungtic-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./server[dev]"
      - run: pytest server
      - name: Assemble release
        run: |
          mkdir -p artifact/public-web artifact/admin-web artifact/server artifact/deploy artifact/wheelhouse
          python -m pip wheel --wheel-dir artifact/wheelhouse ./server
          cp -a apps/public-web/dist/. artifact/public-web/
          cp -a apps/admin-web/dist/. artifact/admin-web/
          cp -a server/. artifact/server/
          cp -a deploy/. artifact/deploy/
      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete artifact/ "$SSH_USER@$SSH_HOST:/opt/lungtic/releases/${{ github.sha }}/"
          ssh "$SSH_USER@$SSH_HOST" "/opt/lungtic/releases/${{ github.sha }}/deploy/scripts/activate-release.sh /opt/lungtic/releases/${{ github.sha }}"
